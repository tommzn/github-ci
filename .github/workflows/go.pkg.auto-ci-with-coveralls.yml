name: Go Package Release
on:
  workflow_call:

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres: # We'll provide a switch to conditional enable services after https://github.com/actions/runner/issues/822 has been implemented.
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get Go version
        run: |
          goversion=$(egrep -i '^go [1-2][.][0-9]+([.][0-9]+)?$' go.mod | awk '{print $2}' | cut -d. -f1,2 | sed 's/$/.x/')
          if [ -z "$goversion" ]; then
            echo "::error::Could not determine Go version from go.mod - check that it has a 'go X.Y' or 'go X.Y.Z' directive" >&2
            exit 1
          fi
          echo "goversion=$goversion" >> $GITHUB_ENV
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.goversion }}
      - name: Run tests
        run: go test -race -covermode atomic -coverprofile=covprofile ./...
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: covprofile

  release:
    name: Go Package Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}