on:
  workflow_call:
    inputs:
      work-directory:
        description: 'Directorz of Go sources'
        default: './'
        required: false
        type: string
    
jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get Go version
        run: |
          goversion=$(egrep -i '^go [1-2][.][0-9]+([.][0-9]+)?$' go.mod | awk '{print $2}' | cut -d. -f1,2 | sed 's/$/.x/')
          if [ -z "$goversion" ]; then
            echo "::error::Could not determine Go version from go.mod - check that it has a 'go X.Y' or 'go X.Y.Z' directive" >&2
            exit 1
          fi
          echo "goversion=$goversion" >> $GITHUB_ENV
        working-directory: ${{ inputs.work-directory }}
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.goversion }}
      - name: Run tests
        run: go test -v  -covermode=count ./...
        working-directory: ${{ inputs.work-directory }}
      