on:
  workflow_call:
    inputs:
      work-directory:
        description: 'Directorz of Go sources'
        default: './'
        required: false
        type: string
      artifact-name:
        description: 'File name of Go bin artifact'
        default: 'build_artifact_bin'
        required: false
        type: string
      
jobs:
  go-build:
    name: Go Binary Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get Go version
        run: |
          goversion=$(egrep -i '^go [1-2][.][0-9]+([.][0-9]+)?$' go.mod | awk '{print $2}' | cut -d. -f1,2 | sed 's/$/.x/')
          if [ -z "$goversion" ]; then
            echo "::error::Could not determine Go version from go.mod - check that it has a 'go X.Y' or 'go X.Y.Z' directive" >&2
            exit 1
          fi
          echo "goversion=$goversion" >> $GITHUB_ENV
        working-directory: ./lambda
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.goversion }}
      - name: Build Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -v -o ${{ inputs.artifact-name }}
        working-directory: ${{ inputs.work-directory }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.work-directory }}/${{ inputs.artifact-name }}
          retention-days: 1
