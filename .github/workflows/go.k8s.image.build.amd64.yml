
name: Image Build (AMD64)
on:
  workflow_call:
    secrets:
      cr-pat:
        description: 'Personal access token'
        required: true

jobs:
  go-build:
    name: Go Binary & Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Set version tag
        id: release
        run: echo ::set-output name=tag::${GITHUB_REF/refs\/tags\/k8s\//}
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Get Go version
        run: |
          goversion=$(egrep -i '^go [1-2][.][0-9]+([.][0-9]+)?$' go.mod | awk '{print $2}' | cut -d. -f1,2 | sed 's/$/.x/')
          if [ -z "$goversion" ]; then
            echo "::error::Could not determine Go version from go.mod - check that it has a 'go X.Y' or 'go X.Y.Z' directive" >&2
            exit 1
          fi
          echo "goversion=$goversion" >> $GITHUB_ENV
        working-directory: ./k8s
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.goversion }}
      - name: Build Binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -v -o build_artifact_bin
        working-directory: ./k8s
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.cr-pat }}
      - name: Build Image
        uses: docker/build-push-action@v2
        with:
          context: ./k8s
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/amd64:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}/amd64:latest
  
        